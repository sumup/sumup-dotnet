name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    if: '!github.event.release.prerelease'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./codegen/go.mod

      - name: Generate SDK
        working-directory: codegen
        run: go run ./... --spec ../openapi.json --output ../src/SumUp --namespace SumUp

      - name: Check no diff after generation
        run: git diff --exit-code

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore SumUp.sln

      - name: Format
        run: dotnet format SumUp.sln --verify-no-changes

      - name: Build
        run: dotnet build SumUp.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test SumUp.sln --configuration Release --no-build

  publish:
    name: Publish to NuGet
    needs: validate
    runs-on: ubuntu-latest
    if: '!github.event.release.prerelease'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'

      - name: Pack
        run: dotnet pack src/SumUp/SumUp.csproj --configuration Release --output nuget

      - name: Publish package
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push nuget/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
